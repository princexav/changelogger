[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "changelogger"
version = "0.1.0"
authors = [
  { name="Kimberly Washington", email="hiokeke26@gmail.com" },
]
description = "Conventional Commit parser and automated semantic release changelog generator."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
changelogger = "changelogger.cli:main"
